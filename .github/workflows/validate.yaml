name: "Validate"
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install -r scripts/requirements.txt
      - name: JSON sanity
        run: |
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True)]"
      - name: Managed-agent cookbooks (lint + structural)
        run: bash scripts/test-cookbooks.sh
      - name: Repo conventions (whitespace, JSON, frontmatter, skill references)
        run: python3 scripts/check-conventions.py
      - name: Guardrail coverage across plugins
        run: python3 scripts/check-guardrails.py
